name: pnyws
description: Penny wise
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  cloud_firestore: ^6.1.0
  collection: ^1.17.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  faker: ^2.2.0
  firebase_auth: ^6.1.2
  firebase_core: any
  flutter:
    sdk: flutter
  flutter_scale_aware:
    git: https://github.com/jogboms/flutter_scale_aware.git
  flutter_slidable: ^4.0.3
  get_version:
    git:
      url: https://github.com/Creky/get_version.git
  google_sign_in: ^6.1.4
  injector: ^4.0.0
  intl: ^0.20.2
  memoize: ^3.0.0
  rxdart: ^0.28.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
